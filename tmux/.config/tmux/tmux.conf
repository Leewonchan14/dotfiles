# Ctrl+a를 prefix로 (Screen 사용자들에게 친숙)
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# vi 모드 사용
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# OS에 따라 클립보드 명령어 분기
# macOS: pbcopy, Linux: xclip
if-shell "uname | grep -qi darwin" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "xclip -selection clipboard"
}
set -s extended-keys always
set -g extended-keys-format csi-u
set -g assume-paste-time 0
set -g allow-passthrough off
set -as terminal-features 'xterm*:extkeys'

# Alt+↑/↓를 pi coding agent가 인식하는 시퀀스(ESC p / ESC n)로 전달
# Alt+↑ → omp dequeue (Alt+Up) 와 충돌하므로 제거. omp 의 Alt+P(모델선택)로 인식됨.
bind-key -n M-Down send-keys Escape n

# 한글(두벌식) 단축키 — 영문 키와 동일한 기능 (한글 입력 모드에서도 동작)
bind-key -T prefix ㅜ next-window               # n
bind-key -T prefix ㅔ previous-window            # p
bind-key -T prefix ㅗ select-pane -L             # h (왼쪽)
bind-key -T prefix ㅓ select-pane -D             # j (아래)
bind-key -T prefix ㅏ select-pane -U             # k (위)
bind-key -T prefix ㅣ select-pane -R             # l (오른쪽)

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# TPM 플러그인 목록 (prefix + I can install plugins)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'true'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-git-branch 'on'
set -g @sessionx-bind-kill-session 'f2'  # macOS에서 Alt/Option 키가 문자입력용이므로 F2로 변경 (기본 alt-bspace 대체)
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '60%'

set -g @plugin 'sandudorogan/tmux-pane-tree'

set -g status-interval 30

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'

# === Window 스타일 (기본 basic → rounded로 변경) ===
set -g @catppuccin_window_status_style "rounded"

# === Window 플래그 아이콘 표시 ===
set -g @catppuccin_window_flags "icon"

# 윈도우 이름 최대 15자로 제한 (너무 길면 … 표시)
set -g @catppuccin_window_text ' #{=|15|…:window_name} '
set -g @catppuccin_window_current_text ' #{=|15|…:window_name} '

# === CPU/RAM 표시를 위한 필수 플러그인 ===
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-cpu + catppuccin 호환성 — #{l:...} 리터럴 대신 직접 스크립트 경로
set -g @catppuccin_cpu_text " #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"

# === Status bar 모듈 활성화 ===

# === Status bar 모듈 활성화 ===
set -g status-right-length 150
set -g status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# tmux-copy-toolkit — 카피 모드에서 flash.nvim 스타일 easymotion 점프
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'CrispyConductor/tmux-copy-toolkit'

# tmux-easymotion — 1/2글자 검색 점프 (leap.nvim 스타일)
set -g @plugin 'ddzero2c/tmux-easymotion#v1.2.2'
set -g @easymotion-s 's'
set -g @easymotion-s2 'S'
set -g @easymotion-hints 'asdghklqwertyuiopzxcvbnmfj;'
set -g @easymotion-case-sensitive 'false'
set -g @easymotion-smartsign 'true'
# 카피 모드에서도 prefix 없이 s/S 직접 사용
set -g @easymotion-copy-mode-no-prefix 'true'

# === 레이아웃 ===
# Space 로 레이아웃 순환 중 실수로 누른 경우 u(undo) 로 이전 레이아웃 복원
bind u select-layout -o

set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @smooth-scroll-mouse 'false'
set -g @smooth-scroll-exit-copy-mode-at-bottom 'false'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '60'

# 반드시 마지막 줄에
run '~/.config/tmux/plugins/tpm/tpm'

# tmux-copy-toolkit의 prefix + C-p (quickopen) 비활성화
# (기본 previous-window 동작 유지)
unbind-key -T prefix C-p

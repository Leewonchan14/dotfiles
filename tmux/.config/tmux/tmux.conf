# Ctrl+a를 prefix로 (Screen 사용자들에게 친숙)
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# vi 모드 사용
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# OS에 따라 클립보드 명령어 분기
# macOS: pbcopy, Linux: xclip
if-shell "uname | grep -qi darwin" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "xclip -selection clipboard"
}
set -g extended-keys on
set -g extended-keys-format csi-u
set -g assume-paste-time 0

# 한글(두벌식) 단축키 — 영문 키와 동일한 기능 (한글 입력 모드에서도 동작)
bind-key -T prefix ㅜ next-window               # n
bind-key -T prefix ㅔ previous-window            # p
bind-key -T prefix ㅗ select-pane -L             # h (왼쪽)
bind-key -T prefix ㅓ select-pane -D             # j (아래)
bind-key -T prefix ㅏ select-pane -U             # k (위)
bind-key -T prefix ㅣ select-pane -R             # l (오른쪽)

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# TPM 플러그인 목록 (prefix + I can install plugins)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'true'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-git-branch 'on'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '60%'

set -g @plugin 'sandudorogan/tmux-pane-tree'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# 반드시 마지막 줄에
run '~/.config/tmux/plugins/tpm/tpm'
